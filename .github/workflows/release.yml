name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: darwin
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: linux
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: linux
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: windows
            arch: amd64
            ext: ".exe"
            archive: zip
          - os: windows
            arch: arm64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          OUTPUT_NAME="agy-session-helper${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "dist/${OUTPUT_NAME}" ./cmd/agy-helper

      - name: Package Archive (Tar)
        if: matrix.archive == 'tar.gz'
        run: |
          cd dist
          tar -czvf "antigravity-session-helper-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "agy-session-helper${{ matrix.ext }}"
          cd ..

      - name: Package Archive (Zip)
        if: matrix.archive == 'zip'
        run: |
          cd dist
          zip -9 "antigravity-session-helper-${{ matrix.os }}-${{ matrix.arch }}.zip" "agy-session-helper${{ matrix.ext }}"
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum *.* > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
